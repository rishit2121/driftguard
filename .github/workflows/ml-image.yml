name: ml-image
# Builds the Akash inference container and publishes it to GHCR (referenced by ml_service/deploy.yaml).
on:
  push:
    branches: [main]
    paths: ["ml_service/**", ".github/workflows/ml-image.yml"]
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ml_service
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/driftguard-ml:0.1.0
            ghcr.io/${{ github.repository_owner }}/driftguard-ml:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Smoke-test the built image
        run: |
          docker run -d --name ml -p 8000:8000 ghcr.io/${{ github.repository_owner }}/driftguard-ml:0.1.0
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 3; done
          python3 ml_service/smoke_test.py http://localhost:8000
